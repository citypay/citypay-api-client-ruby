name: Ruby RSpec Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CP_CLIENT_ID: ${{ secrets.CP_CLIENT_ID }}
      CP_LICENCE_KEY: ${{ secrets.CP_LICENCE_KEY }}
      CP_MERCHANT_ID: ${{ secrets.CP_MERCHANT_ID }}
    strategy:
      matrix:
        ruby-version: ['2.7', '3.0', '3.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true  # handles caching

      - name: Ensure modern RubyGems on 2.7
        if: startsWith(matrix.ruby-version, '2.7')
        run: |
          echo "Ruby: $(ruby -v)"
          echo "RubyGems before: $(gem -v)"
          gem update --system 3.3.22
          gem install bundler
          echo "RubyGems after: $(gem -v)"

      - name: (Optional) Pin ffi on 2.7
        if: startsWith(matrix.ruby-version, '2.7')
        run: gem install ffi -v 1.17.2

      - name: Install gems
        run: bundle install

      - name: Run specs
        run: bundle exec rspec

      - name: Build gem
        run: gem build citypay_api_client.gemspec

      - name: Install built gem
        run: gem install ./citypay_api_client-1.1.4.gem

  build-and-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'created'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build gem
        run: gem build *.gemspec

      - name: Push gem to RubyGems.org
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_APIKEY }}
        run: gem push *.gem